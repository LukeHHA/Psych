name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxext-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            ninja-build

      - name: Configure release
        run: cmake -S . -B build -G Ninja -DPSYCH_ENGINE_BUILD_EDITOR=ON -DPSYCH_ENGINE_BUILD_TESTS=OFF -DGE_ENABLE_ASSERTS=OFF -DGE_ENABLE_PROFILING=OFF -DGE_ENABLE_SANITIZERS=OFF -DGLFW_BUILD_X11=ON -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build release
        run: cmake --build build --parallel

      - name: Package artifact
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/game-engine-${RELEASE_TAG:-release}-linux.tar.gz" out build/PsychEngine/libPsychEngine*.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-engine-${{ gitea.ref_name }}-linux
          path: artifacts/*.tar.gz
